# Cuando la administradora sube fotos o videos al borrador, se optimizan solos
# para que la web siga rápida: fotos a WebP livianas, videos a 720p con portada.
name: Optimizar fotos y videos
on:
  workflow_dispatch: {}
  push:
    branches: [borrador]
    paths:
      - "assets/subidas/**"
      - "content/**"
permissions:
  contents: write
concurrency:
  group: borrador
  cancel-in-progress: false
jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: borrador
      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q pillow pillow-heif
      - name: Optimizar
        run: python3 .github/scripts/optimizar.py
      - name: Guardar cambios
        run: |
          git config user.name "Bloom Web"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/subidas content
          if git diff --cached --quiet; then
            echo "Nada que optimizar."
          else
            git commit -m "Optimizar fotos y videos subidos"
            git pull --rebase origin borrador
            git push origin borrador
          fi
