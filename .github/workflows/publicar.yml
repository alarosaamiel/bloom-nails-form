# Botón "Publicar en la web" del panel: pasa los cambios de la rama borrador a main (la web real).
name: Publicar en la web
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Datos enviados por Pages CMS
        required: false
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Unir borrador con la web
        run: |
          git config user.name "Bloom Web"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin borrador
          if git merge-base --is-ancestor origin/borrador HEAD; then
            echo "No hay cambios nuevos para publicar."
            exit 0
          fi
          git merge --no-ff origin/borrador -m "Publicar cambios del panel"
          git push origin main
      - name: Pedir a GitHub Pages que actualice la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
